<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Island — Dynamic Island для Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#08080b"/>
      <stop offset="0.55" stop-color="#0f0f14"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#bf5af2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b22"/>
      <stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="120" rx="540" ry="290" fill="url(#glow)"/>

  <!-- ── Пилюля ─────────────────────────────────────────────────────────── -->
  <g>
    <rect x="340" y="88" width="520" height="88" rx="44" fill="url(#glass)"/>
    <rect x="340" y="88" width="520" height="88" rx="44" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

    <!-- глаза персонажа -->
    <rect x="376" y="120" width="26" height="20" rx="10" fill="#f5f5f7"/>
    <rect x="410" y="120" width="26" height="20" rx="10" fill="#f5f5f7"/>
    <circle cx="392" cy="131" r="5.4" fill="#0d0d11"/>
    <circle cx="426" cy="131" r="5.4" fill="#0d0d11"/>
    <circle cx="394" cy="129" r="1.7" fill="#ffffff" opacity="0.9"/>
    <circle cx="428" cy="129" r="1.7" fill="#ffffff" opacity="0.9"/>

    <!-- подписи в пилюле -->
    <text x="460" y="126" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#bf5af2">ISLAND</text>
    <text x="460" y="148" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500" fill="#e8e8ed">Midnight City — M83</text>

    <!-- мини-эквалайзер -->
    <g fill="#bf5af2">
      <rect x="756" y="136" width="3" height="10" rx="1.5" opacity="0.55"/>
      <rect x="763" y="130" width="3" height="16" rx="1.5" opacity="0.75"/>
      <rect x="770" y="124" width="3" height="22" rx="1.5"/>
      <rect x="777" y="132" width="3" height="14" rx="1.5" opacity="0.7"/>
    </g>

    <!-- часы -->
    <text x="836" y="142" text-anchor="end" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.4" fill="#f5f5f7">21:47</text>
  </g>

  <!-- ── Капли под пилюлей ──────────────────────────────────────────────── -->
  <g>
    <ellipse cx="430" cy="179" rx="3.4" ry="4.6" fill="url(#drop)"/>
    <path d="M470 184c3.4 4.2 5.6 7.2 5.6 10.2a5.6 5.6 0 0 1-11.2 0c0-3 2.2-6 5.6-10.2z" fill="url(#drop)"/>
    <circle cx="812" cy="196" r="3.6" fill="url(#drop)"/>
    <circle cx="700" cy="222" r="4.6" fill="url(#drop)"/>
    <circle cx="700" cy="222" r="1.6" fill="#ffffff" opacity="0.55"/>
    <path d="M700 176v22" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="600" cy="182" rx="150" ry="10" fill="#bf5af2" opacity="0.16" filter="url(#soft)"/>
  </g>

  <!-- ── Заголовок ──────────────────────────────────────────────────────── -->
  <text x="600" y="352" text-anchor="middle" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#f5f5f7">Island</text>
  <text x="600" y="404" text-anchor="middle" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="500" fill="#a1a1aa">Dynamic Island для Windows</text>
  <text x="600" y="444" text-anchor="middle" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#6e6e76">Пилюля у верхнего края экрана: живые активности, медиа, погода и системный монитор</text>

  <!-- ── Технологии ─────────────────────────────────────────────────────── -->
  <g font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#c7c7cc" text-anchor="middle">
    <rect x="360" y="492" width="89" height="36" rx="18" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="404" y="515">Tauri 2</text>

    <rect x="461" y="492" width="65" height="36" rx="18" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="493" y="515">Rust</text>

    <rect x="538" y="492" width="114" height="36" rx="18" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="595" y="515">TypeScript</text>

    <rect x="664" y="492" width="106" height="36" rx="18" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="717" y="515">Apple HIG</text>

    <rect x="782" y="492" width="58" height="36" rx="18" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="811" y="515">MIT</text>
  </g>

  <text x="600" y="588" text-anchor="middle" font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="14" letter-spacing="0.6" fill="#56565e">© idqwixxa · один .exe, без установщика</text>
</svg>
